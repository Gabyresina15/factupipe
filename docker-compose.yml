services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: factupipe-pgvector
    environment:
      POSTGRES_USER: factupipe
      POSTGRES_PASSWORD: factupipe
      POSTGRES_DB: factupipe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factupipe -d factupipe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
