name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  normalizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
